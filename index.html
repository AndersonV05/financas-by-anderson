main.onchange=e=>{const t=e.target;if(t.id==='bf'){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{let o;try{o=JSON.parse(rd.result)}catch(x){alert('Arquivo inválido. Envie um backup gerado por este app (.json).');return}const w=V.acc;if(o.who&&o.who!==w){alert('Este backup é da conta '+pn(o.who)+'. Troque de conta para restaurá-lo.');return}if(!o.a){alert('Arquivo não parece um backup válido.');return}if(await cf('Importar backup?','Os dados desta conta serão substituídos pelos do arquivo.',1)){if(!o.v)toC(o,[o.a]);S.acc[w]=o.a;['tx','cards','buys','loans'].forEach(n=>S[n]=S[n].filter(x=>x.owner!==w).concat((o[n]||[]).map(x=>({...x,owner:w}))));save();applySet();draw();toast('Backup importado')}};rd.readAsText(f);return}if(t.id==='cc'||t.id==='ch'){const v=(t.value||'').trim();if(/^#[0-9a-f]{6}$/i.test(v)){AC().set.accent=v;save();applySet();draw()}else toast('Use o formato #RRGGBB')}else if(t.dataset.nt){const x=AC().set;x.n=x.n||{};x.n[t.dataset.nt]=t.checked?1:0;save()}else if(t.dataset.set){AC().set[t.dataset.set]=t.checked;save();draw()}else if(t.dataset.f){V.f[t.dataset.f]=t.value;draw()}else if(t.dataset.cvf){V.cvf=V.cvf||{sort:'recent',person:'',cat:''};V.cvf[t.dataset.cvf]=t.value;draw()}else if(t.dataset.cvtog){const dd=cvDraft();dd.show[t.dataset.cvtog]=t.checked?1:0;draw()}else if(t.id==='th'){AC().set.theme=t.value;save();applySet()}else if(t.id==='au'){AC().set.auto=t.checked;save()}};
main.oninput=e=>{if(e.target.id==='cc'){AC().set.accent=e.target.value;applySet();const h=document.getElementById('ch');if(h)h.value=e.target.value}else if(e.target.id==='fs'){AC().set.font=+e.target.value;save();applySet();e.target.previousElementSibling.textContent='Tamanho da letra: '+AC().set.font+'px'}};
const fabw=document.getElementById('fabw'),fabBtn=document.getElementById('fab'),fabCl=()=>{fabw.classList.remove('open');fabBtn.setAttribute('aria-expanded','false')};

document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const t=e.target&&e.target.closest?e.target.closest('[data-tip2]'):null;if(t)showTip(t,e,0);else if(chtip.classList.contains('on'))chtip.classList.remove('on')},{passive:true});

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ============================================================
 * Camada online: Supabase Auth + sincronizacao + compartilhamento.
 * Anexada ao app existente. Usa S, V, K, def, AC, applySet, draw
 * definidos pelo script principal (mesmo escopo global dos scripts).
 * ============================================================ */
(function(){
  "use strict";
  var URL = window.SUPABASE_URL, KEY = window.SUPABASE_ANON_KEY;
  var CFG_OK = !!(URL && KEY) && !/SUA_URL_AQUI|SUA_ANON_KEY_AQUI/.test(URL + KEY);
  var sb=null, ME=null, MAIL=null, USER=null, PARTNER=null, hasPartner=false;
  var savePT=null, booted=false, SHARE_STATE={};
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  /* ---------- estilos ---------- */
  var css=document.createElement('style');
  css.textContent='#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,#15203a,#0a0d14 60%);font-family:Manrope,system-ui,sans-serif;color:#e9edf5}'
   +'#gate.hide{display:none}'
   +'#gate .card{width:100%;max-width:400px;background:#0e1422;border:1px solid #ffffff1c;border-radius:20px;padding:28px 24px;box-shadow:0 30px 80px #0008}'
   +'#gate h1{font-family:"Cormorant Garamond",serif;font-size:30px;margin:0 0 4px}'
   +'#gate h1 em{color:#d4af37;font-style:normal}'
   +'#gate p.sub{margin:0 0 18px;color:#8a94a8;font-size:14px}'
   +'#gate label{display:block;font-size:12px;color:#8a94a8;margin:12px 0 6px}'
   +'#gate input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:#e9edf5;font-size:15px;box-sizing:border-box}'
   +'#gate input:focus{outline:none;border-color:#d4af37}'
   +'#gate .pbtn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;color:#0a0d14;background:linear-gradient(135deg,#f5d77a,#d4af37)}'
   +'#gate .pbtn:disabled{opacity:.6;cursor:default}'
   +'#gate .lnk{background:none;border:none;color:#d4af37;cursor:pointer;font-size:13px;padding:0}'
   +'#gate .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px}'
   +'#gate .msg{margin-top:14px;font-size:13px;min-height:18px}'
   +'#gate .msg.err{color:#f87171}#gate .msg.ok{color:#34d399}'
   +'#acctBtn{background:#ffffff14;border:1px solid #ffffff22;color:#e9edf5;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;margin-left:8px;white-space:nowrap}'
   +'#acctDlg{border:none;border-radius:18px;background:#0e1422;color:#e9edf5;max-width:420px;width:92vw;padding:0;box-shadow:0 30px 80px #000a}'
   +'#acctDlg::backdrop{background:#000a}'
   +'#acctDlg .hd{padding:18px 20px;border-bottom:1px solid #ffffff14;font-weight:800}'
   +'#acctDlg .bd{padding:18px 20px;font-size:14px}'
   +'#acctDlg .bd h4{margin:16px 0 6px;color:#d4af37;font-size:12px;text-transform:uppercase;letter-spacing:.06em}'
   +'#acctDlg .bd h4:first-child{margin-top:0}'
   +'#acctDlg .box{background:#ffffff08;border:1px solid #ffffff14;border-radius:12px;padding:12px}'
   +'#acctDlg input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0d;color:#e9edf5;box-sizing:border-box}'
   +'#acctDlg button.a{border:none;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;color:#0a0d14;background:linear-gradient(135deg,#f5d77a,#d4af37);margin-top:8px}'
   +'#acctDlg button.g{background:#ffffff14;border:1px solid #ffffff22;color:#e9edf5;border-radius:10px;padding:9px 14px;cursor:pointer}'
   +'#acctDlg .mini{color:#8a94a8;font-size:12px}'
   +'#acctDlg .msg{font-size:13px;min-height:16px;margin-top:8px}'
   +'#acctDlg .msg.err{color:#f87171}#acctDlg .msg.ok{color:#34d399}'
   +'body:not(.has-partner) #acc [data-p="b"]{display:none!important}';
  document.head.appendChild(css);
  /* ---------- portao de autenticacao ---------- */
  var gate=document.createElement('div');
  gate.id='gate';
  gate.innerHTML='<div class="card">'
   +'<h1>Finan\u00e7as <em>By Anderson</em></h1>'
   +'<p class="sub" id="gsub">Entre na sua conta</p>'
   +'<div id="gform">'
   +'<label id="lbName">Nome de exibi\u00e7\u00e3o</label>'
   +'<input id="gName" placeholder="Como quer ser chamado(a)" autocomplete="name">'
   +'<label id="lbMail">E-mail</label>'
   +'<input id="gMail" type="email" autocomplete="email" placeholder="voce@email.com">'
   +'<label id="lbPass">Senha</label>'
   +'<input id="gPass" type="password" autocomplete="current-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022">'
   +'<button class="pbtn" id="gGo">Entrar</button>'
   +'<div class="row"><button class="lnk" id="gToSignup">Criar conta</button>'
   +'<button class="lnk" id="gToReset">Esqueci a senha</button></div>'
   +'<div class="msg" id="gMsg"></div></div></div>';
  document.body.appendChild(gate);

  var mode='login';
  function sh(id,b){var e=$(id);if(e)e.style.display=b?'':'none';}
  function gmsg(t,ok){var e=$('gMsg');if(!e)return;e.textContent=t||'';e.className='msg '+(ok===true?'ok':ok===false?'err':'');}
  function setMode(m){
    mode=m;
    var isSignup=m==='signup', isReset=m==='reset', isNew=m==='newpass';
    sh('lbName',isSignup); sh('gName',isSignup);
    sh('lbMail',!isNew); sh('gMail',!isNew);
    sh('lbPass',!isReset); sh('gPass',!isReset);
    sh('gToSignup',!isNew); sh('gToReset',!isReset&&!isNew);
    $('gToSignup').textContent=(m==='login')?'Criar conta':'J\u00e1 tenho conta';
    $('gsub').textContent=isSignup?'Crie sua conta':isReset?'Recuperar senha':isNew?'Defina uma nova senha':'Entre na sua conta';
    $('gGo').textContent=isSignup?'Criar conta':isReset?'Enviar link':isNew?'Salvar senha':'Entrar';
    gmsg('');
  }
  function traduz(m){m=String(m);
    if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
    if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar.';
    if(/already registered|User already/i.test(m))return 'Este e-mail j\u00e1 tem conta. Fa\u00e7a login.';
    if(/rate limit|too many/i.test(m))return 'Muitas tentativas. Aguarde um pouco.';
    if(/should be at least 6/i.test(m))return 'A senha deve ter ao menos 6 caracteres.';
    return m;}

  async function doGo(){
    if(!sb)return;
    var email=($('gMail').value||'').trim(), pass=$('gPass').value||'', name=($('gName').value||'').trim();
    $('gGo').disabled=true;
    try{
      if(mode==='signup'){
        if(!email||pass.length<6){gmsg('Informe e-mail e senha (m\u00edn. 6 caracteres).',false);return;}
        var r=await sb.auth.signUp({email:email,password:pass,options:{data:{display_name:name||email.split('@')[0]}}});
        if(r.error)throw r.error;
        if(!r.data.session){gmsg('Conta criada! Confirme pelo e-mail enviado e depois entre.',true);setMode('login');return;}
      }else if(mode==='reset'){
        if(!email){gmsg('Informe seu e-mail.',false);return;}
        var rr=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});
        if(rr.error)throw rr.error;
        gmsg('Enviamos um link de redefini\u00e7\u00e3o para seu e-mail.',true);return;
      }else if(mode==='newpass'){
        if(pass.length<6){gmsg('A senha deve ter ao menos 6 caracteres.',false);return;}
        var rn=await sb.auth.updateUser({password:pass});
        if(rn.error)throw rn.error;
        gmsg('Senha atualizada!',true);
        location.hash=''; setTimeout(function(){gate.classList.add('hide');},700);return;
      }else{
        var rl=await sb.auth.signInWithPassword({email:email,password:pass});
        if(rl.error)throw rl.error;
      }
    }catch(e){gmsg(traduz(e.message||String(e)),false);}
    finally{$('gGo').disabled=false;}
  }
  /* ---------- sincronizacao de dados ---------- */
  function f(o){return function(x){return x.owner===o;};}
  function mineDoc(){
    return { a:S.acc.a,
      tx:S.tx.filter(f('a')), cards:S.cards.filter(f('a')),
      buys:S.buys.filter(f('a')), loans:S.loans.filter(f('a')),
      fav:S.fav, people:S.people, site:S.site };
  }
  function applyMine(doc){
    if(doc.a) S.acc.a=doc.a;
    ['tx','cards','buys','loans'].forEach(function(n){
      S[n]=S[n].filter(function(x){return x.owner!=='a';})
              .concat((doc[n]||[]).map(function(x){var y=Object.assign({},x);y.owner='a';return y;}));
    });
    if(doc.fav)S.fav=doc.fav;
    if(doc.people)S.people=doc.people;
    if(doc.site)S.site=doc.site;
  }
  function freshMine(){
    var name='Minha conta';
    try{
      name=(USER&&USER.user_metadata&&USER.user_metadata.display_name)
        ||(MAIL?MAIL.split('@')[0]:'Minha conta');
    }catch(e){}
    S.acc.a=blankAccount(name);
    ['tx','cards','buys','loans'].forEach(function(n){
      S[n]=S[n].filter(function(x){return x.owner!=='a';});
    });
    S.fav=[];
    S.people=[
      {id:'eu',name:'Eu',e:'🧑',c:'#22d3ee'},
      {id:'mae',name:'Mãe',e:'👩',c:'#f472b6'}
    ];
    S.site={accent:'#6d7cff'};
  }
  function applyPartner(doc,info){
    S.acc.b = doc.a || blankAccount(info&&info.name?info.name:'Outra conta');
    if(info){ S.acc.b.pf=S.acc.b.pf||{}; if(info.name){S.acc.b.pf.n=info.name;S.acc.b.pf.dn=info.name;} }
    ['tx','cards','buys','loans'].forEach(function(n){
      S[n]=S[n].filter(function(x){return x.owner!=='b';})
              .concat((doc[n]||[]).map(function(x){var y=Object.assign({},x);y.owner='b';return y;}));
    });
  }
  function clearPartner(){
    S.acc.b=blankAccount('Outra conta');
    ['tx','cards','buys','loans'].forEach(function(n){
      S[n]=S[n].filter(function(x){return x.owner!=='b';});
    });
  }
  async function pushMine(silent){
    if(!ME||!sb)return;
    try{ await sb.from('user_data').upsert({user_id:ME,doc:mineDoc(),updated_at:new Date().toISOString()}); }
    catch(e){ if(!silent)console.error('pushMine',e); }
  }
  window.__supaSave=function(){
    if(!ME)return;
    clearTimeout(savePT);
    savePT=setTimeout(function(){pushMine(true);},600);
  };


  async function loadAll(){
    var firstTime=false;
    var mine=await sb.from('user_data').select('doc').eq('user_id',ME).maybeSingle();
    if(mine.data && mine.data.doc && mine.data.doc.a){ applyMine(mine.data.doc); }
    else{
      firstTime=true; freshMine();
      try{ if(USER&&USER.user_metadata&&USER.user_metadata.display_name){ S.acc.a.pf.n=S.acc.a.pf.dn=USER.user_metadata.display_name; } }catch(e){}
      await pushMine(true);
    }
    await loadPartner();
  }
  async function loadPartner(){
    hasPartner=false; PARTNER=null;
    try{
      var st=await sb.rpc('my_share_state'); SHARE_STATE=st.data||{};
      if(SHARE_STATE.partner){
        PARTNER=SHARE_STATE.partner.id; hasPartner=true;
        var pd=await sb.from('user_data').select('doc').eq('user_id',PARTNER).maybeSingle();
        applyPartner((pd.data&&pd.data.doc)||{}, SHARE_STATE.partner);
      }else{ clearPartner(); }
    }catch(e){ clearPartner(); }
    document.body.classList.toggle('has-partner', hasPartner);
    if(!hasPartner && V.acc==='b'){ V.acc='a'; S.cur='a'; }
  }
  function redraw(){try{if(!document.querySelector('dialog[open]')){applySet();draw();}}catch(e){}}
  /* ---------- UI de conta / compartilhamento ---------- */
  function mountAcctButton(){
    var tb=document.querySelector('.tb');
    if(tb && !$('acctBtn')){
      var b=document.createElement('button');
      b.id='acctBtn'; b.type='button'; b.textContent='\u2699\ufe0e Conta';
      b.onclick=openAcct; tb.appendChild(b);
    }
    if(!$('acctDlg')){
      var dlg=document.createElement('dialog'); dlg.id='acctDlg';
      document.body.appendChild(dlg); window.__acctDlg=dlg;
    }
    var main=$('main');
    if(main && !window.__mo){
      window.__mo=new MutationObserver(function(){
        var fab=$('fabw'); if(fab) fab.style.display=(V.acc==='b')?'none':'';
      });
      window.__mo.observe(main,{childList:true});
    }
  }
  async function openAcct(){
    try{ var st=await sb.rpc('my_share_state'); SHARE_STATE=st.data||{}; }catch(e){}
    renderAcct(); window.__acctDlg.showModal();
  }
  function amsg(t,ok){var e=$('acctMsg');if(e){e.textContent=t||'';e.className='msg '+(ok?'ok':'err');}}
  function renderAcct(){
    var s=SHARE_STATE||{}, p=s.partner, sent=(s.sent||[]), recv=(s.received||[]);
    var share;
    if(p){
      share='<div class="box"><div>Compartilhando com <b>'+esc(p.name||p.email)+'</b></div>'
        +'<div class="mini">'+esc(p.email||'')+'</div>'
        +'<button class="g" data-act="end" style="margin-top:10px">Encerrar compartilhamento</button></div>';
    }else if(recv.length){
      share='<div class="box"><div>Convite recebido de <b>'+esc(recv[0].from||recv[0].email)+'</b></div>'
        +'<div style="margin-top:8px"><button class="a" data-act="accept" data-id="'+recv[0].id+'">Aceitar</button> '
        +'<button class="g" data-act="decline" data-id="'+recv[0].id+'">Recusar</button></div></div>';
    }else if(sent.length){
      share='<div class="box"><div>Convite enviado para <b>'+esc(sent[0].email)+'</b></div>'
        +'<div class="mini">Aguardando aceite\u2026</div>'
        +'<button class="g" data-act="cancel" data-id="'+sent[0].id+'" style="margin-top:8px">Cancelar convite</button></div>';
    }else{
      share='<div class="box"><div class="mini">Convide outra pessoa para compartilhar as finan\u00e7as do casal (m\u00e1x. 2 contas).</div>'
        +'<input id="invMail" type="email" placeholder="email@da.pessoa" style="margin-top:8px">'
        +'<button class="a" data-act="invite">Enviar convite</button></div>';
    }
    var migr = '';
    window.__acctDlg.innerHTML='<div class="hd">Conta</div><div class="bd">'
      +'<h4>Sess\u00e3o</h4><div class="box"><div>'+esc(MAIL||'')+'</div>'
      +'<button class="g" data-act="logout" style="margin-top:10px">Sair</button></div>'
      +'<h4>Compartilhamento</h4>'+share+migr
      +'<div class="msg" id="acctMsg"></div>'
      +'<div style="text-align:right;margin-top:14px"><button class="g" data-act="close">Fechar</button></div></div>';
    window.__acctDlg.querySelectorAll('[data-act]').forEach(function(b){
      b.onclick=function(){handleAcct(b.getAttribute('data-act'),b.getAttribute('data-id'));};
    });
  }
  async function refreshState(){ try{var st=await sb.rpc('my_share_state');SHARE_STATE=st.data||{};}catch(e){} }
  async function handleAcct(act,id){
    try{
      if(act==='close'){window.__acctDlg.close();return;}
      if(act==='logout'){await sb.auth.signOut();location.reload();return;}
      if(act==='invite'){
        var em=($('invMail')||{}).value||'';
        var r=await sb.rpc('send_invite',{p_email:em}); if(r.error)throw r.error;
        await refreshState(); renderAcct();
        amsg(r.data&&r.data.found?'Convite enviado!':'Convite registrado. A pessoa precisa criar conta com esse e-mail.',true);
        return;
      }
      if(act==='accept'){ var ra=await sb.rpc('accept_invite',{p_id:id}); if(ra.error)throw ra.error; await loadPartner(); redraw(); await refreshState(); renderAcct(); amsg('Compartilhamento ativado!',true); return; }
      if(act==='decline'||act==='cancel'){ var rc=await sb.rpc('cancel_invite',{p_id:id}); if(rc.error)throw rc.error; await refreshState(); renderAcct(); amsg(act==='decline'?'Convite recusado.':'Convite cancelado.',true); return; }
      if(act==='end'){ if(!confirm('Encerrar o compartilhamento? O acesso aos dados do parceiro ser\u00e1 removido.'))return; var re=await sb.rpc('end_share'); if(re.error)throw re.error; await loadPartner(); redraw(); await refreshState(); renderAcct(); amsg('Compartilhamento encerrado.',true); return; }
    }catch(e){ amsg(traduz(e.message||String(e)),false); }
  }
  /* ---------- realtime ---------- */
  function subscribeRealtime(){
    try{
      if(window.__rtCh){ sb.removeChannel(window.__rtCh); window.__rtCh=null; }
      window.__rtCh=sb.channel('fin-rt')
        .on('postgres_changes',{event:'*',schema:'public',table:'user_data'},function(pl){
          var row=pl.new||{};
          if(PARTNER && row.user_id===PARTNER){ loadPartner().then(redraw); }
        })
        .on('postgres_changes',{event:'*',schema:'public',table:'share_members'},function(){
          loadPartner().then(redraw);
        })
        .subscribe();
    }catch(e){}
  }

  /* ---------- fluxo de sessao ---------- */
  async function afterLogin(session){
    USER=session.user; ME=session.user.id; MAIL=session.user.email;
    try{
      await sb.from('profiles').upsert({id:ME,email:MAIL,
        display_name:(USER.user_metadata&&USER.user_metadata.display_name)||MAIL.split('@')[0]});
    }catch(e){}
    await loadAll();
    gate.classList.add('hide');
    mountAcctButton();
    booted=true;
    try{ V.acc='a'; S.cur='a'; applySet(); draw(); }catch(e){ console.error(e); }
    subscribeRealtime();
  }

  /* ---------- inicializacao ---------- */
  if(!CFG_OK){
    gate.querySelector('.card').innerHTML='<h1>Finan\u00e7as <em>By Anderson</em></h1>'
     +'<p class="sub">Configura\u00e7\u00e3o necess\u00e1ria</p>'
     +'<p style="color:#8a94a8;font-size:14px;line-height:1.5">Edite o arquivo <b>config.js</b> e preencha a <b>URL</b> e a chave <b>anon</b> do seu projeto Supabase. Depois recarregue a p\u00e1gina.</p>';
    return;
  }
  if(!window.supabase||!window.supabase.createClient){
    gate.querySelector('.sub').textContent='Falha ao carregar a biblioteca Supabase. Verifique sua conex\u00e3o e recarregue.';
    return;
  }
  sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  setMode('login');
  $('gGo').onclick=doGo;
  $('gToSignup').onclick=function(){setMode(mode==='signup'?'login':'signup');};
  $('gToReset').onclick=function(){setMode('reset');};
  ['gMail','gPass','gName'].forEach(function(id){var e=$(id);if(e)e.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();doGo();}});});

  sb.auth.onAuthStateChange(function(evt,session){
    if(evt==='PASSWORD_RECOVERY'){ gate.classList.remove('hide'); setMode('newpass'); return; }
    if(session && session.user){ if(!booted||ME!==session.user.id) afterLogin(session); }
    else if(evt==='SIGNED_OUT'){ booted=false; ME=null; gate.classList.remove('hide'); }
  });
  sb.auth.getSession().then(function(r){
    if(r.data && r.data.session){ afterLogin(r.data.session); }
    else { gate.classList.remove('hide'); }
  });
})();


</script>
</body></html>
